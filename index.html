<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Senzo Warehouse Manager</title>
    <style>
      #root:empty::before {
        content: 'Loading App Data...';
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        width: 100vw;
        background: #0f172a;
        color: white;
        font-family: sans-serif;
        font-size: 1.2rem;
        font-weight: bold;
      }
    </style>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (!document.getElementById('root')?.innerHTML) {
          document.body.innerHTML = '<div style="padding:20px;color:white;background:#0f172a;height:100vh;font-family:sans-serif;"><h3>Init Error</h3><p>' + message + '</p><button onclick="localStorage.clear();location.reload()" style="padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:5px;margin-top:20px;">Reset App</button></div>';
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        if (!document.getElementById('root')?.innerHTML) {
          document.body.innerHTML = '<div style="padding:20px;color:white;background:#0f172a;height:100vh;font-family:sans-serif;"><h3>Promise Error</h3><p>' + (event.reason?.message || event.reason) + '</p><button onclick="localStorage.clear();location.reload()" style="padding:10px 20px;background:#ef4444;color:white;border:none;border-radius:5px;margin-top:20px;">Reset App</button></div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
